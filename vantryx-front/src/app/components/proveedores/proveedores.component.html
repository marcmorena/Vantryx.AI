<div class="animate-in fade-in duration-500">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-black text-white italic">RED DE PROVEEDORES</h2>
    <button (click)="abrirModalCrear()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3 px-8 rounded-2xl font-bold transition-all">
      Registrar Proveedor
    </button>
  </div>

  <!-- Tarjetas de Proveedores -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let sup of suppliers; trackBy: trackById">
    <div *ngIf="sup.name" class="bg-slate-800/40 border border-slate-700 p-8 rounded-[2rem] relative group">
      <!-- Botones de Acción -->
      <div class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
        <button (click)="prepararEdicion(sup)" class="p-2 bg-blue-600 rounded-lg text-white">✏️</button>
        <button (click)="eliminarProveedor(sup.id, $event)" class="p-2 bg-red-600 rounded-lg text-white">🗑️</button>
      </div>

      <h3 class="text-2xl font-bold text-white mb-4">{{sup.name}}</h3>
      <div class="space-y-2 text-slate-400 text-sm">
        <p>👤 {{sup.contactName}}</p>
        <p>📞 {{sup.phone}}</p>
        <p>📧 {{sup.email}}</p>
        <p class="italic text-xs">📍 {{sup.address}}</p>
      </div>
    </div>
  </div>

  <!-- MODAL (El contenido evita el bloqueo de pantalla) -->
  <div *ngIf="mostrarModalProveedor" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-700 p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
      <h2 class="text-2xl font-bold text-white mb-6">{{ editando ? 'Editar Proveedor' : 'Nuevo Proveedor' }}</h2>
      
      <div class="space-y-4">
        <div>
          <label class="text-slate-400 text-xs ml-2">Nombre de Empresa</label>
          <input type="text" [(ngModel)]="nuevoProveedor.name" class="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div>
          <label class="text-slate-400 text-xs ml-2">Persona de Contacto</label>
          <input type="text" [(ngModel)]="nuevoProveedor.contactName" class="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div>
          <label class="text-slate-400 text-xs ml-2">Teléfono</label>
          <input type="text" [(ngModel)]="nuevoProveedor.phone" class="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-white">
        </div>
        <div>
          <label class="text-slate-400 text-xs ml-2">Email</label>
          <input type="email" [(ngModel)]="nuevoProveedor.email" class="w-full bg-slate-800 border-slate-700 rounded-xl p-3 text-white">
        </div>
      </div>

      <div class="flex gap-4 mt-8">
        <button (click)="mostrarModalProveedor = false" class="flex-1 py-3 text-slate-400 font-bold">Cancelar</button>
        <button (click)="guardarProveedor()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-500">
          {{ editando ? 'Actualizar' : 'Guardar' }}
        </button>
      </div>
    </div>
  </div>
</div>
