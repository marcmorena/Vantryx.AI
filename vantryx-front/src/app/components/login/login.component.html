<div class="flex items-center justify-center py-10">
  <div class="w-full max-w-md animate-in fade-in zoom-in duration-500">

    <div class="text-center mb-10">
      <h1 class="text-3xl font-black text-white tracking-tighter italic">VANTRYX <span class="text-blue-500">AI</span></h1>
      <p class="text-slate-500 text-sm mt-2 font-medium tracking-wide">SISTEMA DE GESTIÓN INTELIGENTE</p>
    </div>

    <div class="bg-slate-900/50 border border-slate-800 p-8 rounded-[2.5rem] backdrop-blur-xl shadow-2xl">
      <div class="space-y-6">

        <div *ngIf="error"
             class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-2xl px-4 py-3 text-center">
          {{ error }}
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] uppercase font-black tracking-[0.2em] mb-2 ml-1">Identificador</label>
          <input type="text" placeholder="Usuario"
                 [(ngModel)]="username"
                 (keyup.enter)="login()"
                 class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-700">
        </div>

        <div>
          <label class="block text-slate-400 text-[10px] uppercase font-black tracking-[0.2em] mb-2 ml-1">Contraseña</label>
          <input type="password" placeholder="••••••••"
                 [(ngModel)]="password"
                 (keyup.enter)="login()"
                 class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder:text-slate-700">
        </div>

        <button (click)="login()" [disabled]="loading"
                class="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20 active:scale-[0.98] flex items-center justify-center gap-2">
          <span *ngIf="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>{{ loading ? 'Autenticando...' : 'Acceder al Sistema' }}</span>
        </button>
      </div>

      <div class="mt-8 pt-6 border-t border-slate-800/50 text-center">
        <p class="text-slate-500 text-xs">¿No tienes acceso? <span class="text-blue-400 cursor-pointer hover:underline">Contacta con el administrador</span></p>
      </div>
    </div>

    <p class="text-center text-slate-600 text-[10px] mt-8 uppercase tracking-[0.3em]">Encrypted Session • v2.0.4</p>
  </div>
</div>
