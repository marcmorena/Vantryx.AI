# =====================================================
# VANTRYX AI — Configuración de la aplicación
# =====================================================
# Las credenciales sensibles se cargan desde variables
# de entorno. Para desarrollo local, copia el archivo
# application-local.properties.example y renómbralo a
# application-local.properties (ya está en .gitignore)
# =====================================================

spring.application.name=Vantryx AI

# ── Base de datos ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vantryx_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.docker.compose.enabled=false

# ── Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT ───────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Swagger / OpenAPI ─────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.writer-with-default-pretty-printer=true

# ── Ollama (IA local) ─────────────────────────────
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:phi3}
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.timeout=300000
spring.mvc.async.request-timeout=300000

# ── Email (Mailtrap / SMTP) ───────────────────────
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
